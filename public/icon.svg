<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#bef264"/>
      <stop offset="85%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </radialGradient>
    <linearGradient id="paddleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.3"/>

  <!-- Paddle Handle -->
  <g transform="rotate(-35 256 256)">
    <!-- Handle -->
    <rect x="236" y="310" width="40" height="130" rx="10" fill="#334155" stroke="#475569" stroke-width="4"/>
    <!-- Grip Wrap Marks -->
    <line x1="236" y1="340" x2="276" y2="350" stroke="#1e293b" stroke-width="4"/>
    <line x1="236" y1="370" x2="276" y2="380" stroke="#1e293b" stroke-width="4"/>
    <line x1="236" y1="400" x2="276" y2="410" stroke="#1e293b" stroke-width="4"/>

    <!-- Paddle Blade -->
    <rect x="156" y="90" width="200" height="235" rx="55" fill="url(#paddleGrad)" stroke="#ffffff" stroke-width="8"/>
    <!-- Inner Blade Accent -->
    <rect x="176" y="110" width="160" height="195" rx="40" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Optic Yellow Pickleball with Holes -->
  <g transform="translate(340, 150)">
    <circle cx="0" cy="0" r="75" fill="url(#ballGrad)" stroke="#3f6212" stroke-width="4"/>
    <!-- Perforations / Holes -->
    <circle cx="0" cy="0" r="11" fill="#3f6212"/>
    <circle cx="-35" cy="-25" r="10" fill="#3f6212"/>
    <circle cx="35" cy="-25" r="10" fill="#3f6212"/>
    <circle cx="-35" cy="25" r="10" fill="#3f6212"/>
    <circle cx="35" cy="25" r="10" fill="#3f6212"/>
    <circle cx="0" cy="-48" r="9" fill="#3f6212"/>
    <circle cx="0" cy="48" r="9" fill="#3f6212"/>
  </g>
</svg>
